name: US Undervalued Screener

on:
  schedule:
    # Senin-Jumat jam 22:00 WIB (15:00 UTC)
    - cron: '0 15 * * 1-5'
  workflow_dispatch:
    inputs:
      universe:
        description: 'Universe saham US (liquid, sp500, tech, value)'
        default: 'liquid'
        type: choice
        options: [liquid, sp500, tech, value]
      limit:
        description: 'Jumlah top saham'
        default: '30'

env:
  PYTHONIOENCODING: utf-8

jobs:
  screen:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run US screener
        run: |
          UNIVERSE="${{ inputs.universe || 'liquid' }}"
          LIMIT="${{ inputs.limit || '30' }}"
          TODAY=$(date +%Y-%m-%d)

          # Run screener → markdown report
          python screeners/us/scripts/us_undervalued_screener.py \
            --universe "$UNIVERSE" --limit "$LIMIT" \
            --format markdown --output "reports/us/${TODAY}.md"

          # Copy sebagai latest
          cp "reports/us/${TODAY}.md" reports/us/latest.md

          # Run screener → JSON
          python screeners/us/scripts/us_undervalued_screener.py \
            --universe "$UNIVERSE" --limit "$LIMIT" \
            --format json --output "reports/us/${TODAY}.json"

      - name: Commit & push reports
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@github-actions"
          git add reports/us/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🇺🇸 US report $(date +%Y-%m-%d)"
            git push
          fi
