name: IDX Undervalued Screener

on:
  schedule:
    # Senin-Jumat jam 16:30 WIB (09:30 UTC)
    - cron: '30 9 * * 1-5'
  workflow_dispatch:
    inputs:
      universe:
        description: 'Universe saham (IHSG, LQ45, IDX30, Value100)'
        default: 'IHSG'
        type: choice
        options: [IHSG, LQ45, IDX30, Value100]
      limit:
        description: 'Jumlah top saham'
        default: '30'

env:
  PYTHONIOENCODING: utf-8

jobs:
  screen:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run IDX screener
        env:
          STOCKBIT_TOKEN: ${{ secrets.STOCKBIT_TOKEN }}
        run: |
          UNIVERSE="${{ inputs.universe || 'IHSG' }}"
          LIMIT="${{ inputs.limit || '30' }}"
          TODAY=$(date +%Y-%m-%d)

          # Buat stockbit token file kalau ada
          if [ -n "$STOCKBIT_TOKEN" ]; then
            echo "$STOCKBIT_TOKEN" > ~/.stockbit_token
          fi

          # Run screener → markdown report
          python screeners/idx/scripts/tuntun_undervalued_screener.py \
            --universe "$UNIVERSE" --limit "$LIMIT" \
            --format markdown --output "reports/idx/${TODAY}.md"

          # Copy juga sebagai latest
          cp "reports/idx/${TODAY}.md" reports/idx/latest.md

          # Run screener → JSON (untuk dry-run tracking)
          python screeners/idx/scripts/tuntun_undervalued_screener.py \
            --universe "$UNIVERSE" --limit "$LIMIT" \
            --format json --output "reports/idx/${TODAY}.json"

      - name: Commit & push reports
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@github-actions"
          git add reports/idx/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📊 IDX report $(date +%Y-%m-%d)"
            git push
          fi
