name: Daily Pipeline

on:
  schedule:
    # 09:00 WIB setiap hari (02:00 UTC)
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      skip_top_picks:
        description: "Skip screener top picks"
        type: boolean
        default: false
      eval_type:
        description: "Evaluation type (auto, checkpoint, gate1)"
        type: string
        default: auto

permissions:
  contents: write

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          SKIP_TOP_PICKS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_top_picks == true && '1' || '0' }}
          EVAL_TYPE: ${{ github.event.inputs.eval_type || 'auto' }}
          GIT_COMMIT: "1"
          STRICTNESS: balanced
          LIMIT: "5"
        run: |
          chmod +x run_daily.sh run_top_picks.sh run_evaluation.sh
          ./run_daily.sh

      - name: Summary
        if: always()
        run: |
          echo "## Daily Pipeline $(date +%Y-%m-%d)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/evaluation/reports/latest.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            head -n 25 reports/evaluation/reports/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi
