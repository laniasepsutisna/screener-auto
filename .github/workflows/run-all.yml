name: Run All Screeners

on:
  workflow_dispatch:
    inputs:
      screeners:
        description: 'Screener mana yang dijalankan'
        default: 'all'
        type: choice
        options:
          - all
          - idx
          - crypto
          - us

env:
  PYTHONIOENCODING: utf-8

jobs:
  run-all:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run selected screeners
        env:
          STOCKBIT_TOKEN: ${{ secrets.STOCKBIT_TOKEN }}
        run: |
          TODAY=$(date +%Y-%m-%d)
          CHOICE="${{ inputs.screeners || 'all' }}"

          if [ -n "$STOCKBIT_TOKEN" ]; then
            echo "$STOCKBIT_TOKEN" > ~/.stockbit_token
          fi

          if [ "$CHOICE" = "all" ] || [ "$CHOICE" = "idx" ]; then
            echo "▶ Running IDX screener..."
            python screeners/idx/scripts/tuntun_undervalued_screener.py \
              --universe IHSG --limit 30 \
              --format markdown --output "reports/idx/${TODAY}.md" || true
            [ -f "reports/idx/${TODAY}.md" ] && cp "reports/idx/${TODAY}.md" reports/idx/latest.md
          fi

          if [ "$CHOICE" = "all" ] || [ "$CHOICE" = "crypto" ]; then
            echo "▶ Running Crypto screener..."
            python screeners/crypto/scripts/crypto_undervalued_screener.py \
              --universe top100 --limit 20 \
              --format markdown --output "reports/crypto/${TODAY}.md" || true
            [ -f "reports/crypto/${TODAY}.md" ] && cp "reports/crypto/${TODAY}.md" reports/crypto/latest.md
          fi

          if [ "$CHOICE" = "all" ] || [ "$CHOICE" = "us" ]; then
            echo "▶ Running US screener..."
            python screeners/us/scripts/us_undervalued_screener.py \
              --universe liquid --limit 30 \
              --format markdown --output "reports/us/${TODAY}.md" || true
            [ -f "reports/us/${TODAY}.md" ] && cp "reports/us/${TODAY}.md" reports/us/latest.md
          fi

      - name: Commit & push reports
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@github-actions"
          git add reports/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📊 Screener reports $(date +%Y-%m-%d)"
            git push
          fi
